services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: yijing-gomoku:latest
    container_name: yijing-gomoku
    restart: unless-stopped
    ports:
      - "25562:25562"
    environment:
      PORT: "25562"
      DATABASE_URL: "sqlite:////app/data/gomoku.db"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-168}"
      RECONNECT_GRACE_SECONDS: "${RECONNECT_GRACE_SECONDS:-120}"
      # 铜铃冷却（秒）。0 = 不限制，允许连按 / 连点器连续催铃。
      RING_COOLDOWN_SECONDS: "${RING_COOLDOWN_SECONDS:-0}"
      CHALLENGE_TTL_SECONDS: "${CHALLENGE_TTL_SECONDS:-30}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      # AI 引擎在浏览器端运行，容器无需任何引擎配置。
      # 网络电台曲库：宿主机目录以只读方式挂到 /radio。
      RADIO_DIR: "/radio"
    volumes:
      - ./data:/app/data
      - "${RADIO_DIR_HOST:-./radio}:/radio:ro"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:25562/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
